targets=call0,calldn,callf,callfn,calln,calls,clint.log,distcheck.log,fixme.log,includes,pclint.log,pkgconfig.log,tests.log
cppflags_force=-I../include
cflags_force=`pkg-config --cflags libSystem`
cflags=-W -Wall -g -O2 -fPIE -D_FORTIFY_SOURCE=2 -fstack-protector
ldflags_force=`pkg-config --libs libSystem` $(OBJDIR)../src/libMarshall.a
ldflags=-pie -Wl,-z,relro -Wl,-z,now
dist=Makefile,clint.sh,distcheck.sh,fixme.sh,pclint.sh,pkgconfig.sh,tests.sh

#targets
[call0]
type=binary
depends=$(OBJDIR)../src/libMarshall.a
sources=call0.c

[calldn]
type=binary
depends=$(OBJDIR)../src/libMarshall.a
sources=calldn.c

[callf]
type=binary
depends=$(OBJDIR)../src/libMarshall.a
sources=callf.c

[callfn]
type=binary
depends=$(OBJDIR)../src/libMarshall.a
sources=callfn.c

[calln]
type=binary
depends=$(OBJDIR)../src/libMarshall.a
sources=calln.c

[calls]
type=binary
depends=$(OBJDIR)../src/libMarshall.a
sources=calls.c

[clint.log]
type=script
script=./clint.sh
enabled=0
depends=$(OBJDIR)../src/libMarshall.a,clint.sh

[distcheck.log]
type=script
script=./distcheck.sh
enabled=0
depends=$(OBJDIR)../src/libMarshall.a,distcheck.sh

[fixme.log]
type=script
script=./fixme.sh
enabled=0
depends=$(OBJDIR)../src/libMarshall.a,fixme.sh

[includes]
type=binary
depends=$(OBJDIR)../src/libMarshall.a
sources=includes.c

[pclint.log]
type=script
script=./pclint.sh
enabled=0
depends=$(OBJDIR)../data/libMarshall.pc,pclint.sh

[pkgconfig.log]
type=script
script=./pkgconfig.sh
enabled=0
depends=$(OBJDIR)../data/libMarshall.pc,pkgconfig.sh

[tests.log]
type=script
script=./tests.sh
enabled=0
depends=tests.sh,$(OBJDIR)../src/libMarshall.a,$(OBJDIR)call0$(EXEEXT),$(OBJDIR)calldn$(EXEEXT),$(OBJDIR)callf$(EXEEXT),$(OBJDIR)callfn$(EXEEXT),$(OBJDIR)calln$(EXEEXT),$(OBJDIR)calls$(EXEEXT),$(OBJDIR)includes$(EXEEXT)
